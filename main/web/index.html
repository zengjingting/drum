<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a0b0d">
  <meta name="description" content="EasyInput 六音色硬件鼓机与 16 步音序器">
  <title>EasyInput Drum Machine</title>
  <style>
    :root{color-scheme:dark;--ink:#f4f2ea;--muted:#888b86;--line:#292c2d;--panel:#141617;--panel2:#101213;--accent:#ff7043;--cool:#71e0d4;--step:34px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100dvh;color:var(--ink);background:radial-gradient(circle at 86% 0%,rgba(113,224,212,.08),transparent 28rem),radial-gradient(circle at 10% 100%,rgba(255,112,67,.09),transparent 30rem),#0a0b0d}button,textarea{font:inherit}main{width:min(1180px,calc(100% - 32px));margin:auto;padding:28px 0 56px}header{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:14px}.brand-mark{width:40px;height:40px;display:grid;grid-template-columns:repeat(3,1fr);align-items:end;gap:3px;padding:8px;border:1px solid #343839;border-radius:12px;background:var(--panel)}.brand-mark i{display:block;border-radius:2px;background:var(--cool)}.brand-mark i:nth-child(1){height:45%}.brand-mark i:nth-child(2){height:100%;background:var(--accent)}.brand-mark i:nth-child(3){height:68%}.eyebrow{margin:0 0 3px;color:var(--cool);font:700 10px/1 ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase}h1{margin:0;font-size:clamp(18px,3vw,24px);line-height:1;letter-spacing:-.03em}.connection{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border:1px solid #343839;border-radius:999px;color:var(--muted);background:var(--panel);cursor:pointer}.connection:hover{color:var(--ink);border-color:#555a5b}.connection:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid var(--cool);outline-offset:3px}.dot{width:8px;height:8px;border-radius:50%;background:#5c6061}.connection.online .dot{background:var(--cool);box-shadow:0 0 0 4px rgba(113,224,212,.12)}.connection.error .dot{background:var(--accent)}.transport{display:grid;grid-template-columns:minmax(230px,.72fr) minmax(320px,1.28fr);gap:16px;margin-bottom:16px}.panel{border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,rgba(22,24,25,.98),rgba(16,18,19,.96));box-shadow:0 18px 60px rgba(0,0,0,.18)}.tempo-panel{display:grid;grid-template-columns:1fr auto;align-items:center;padding:24px}.tempo-label{margin:0 0 6px;color:var(--muted);font-size:11px;letter-spacing:.12em}.tempo-readout{display:flex;align-items:baseline;gap:9px}#bpmValue{font-size:clamp(56px,8vw,88px);font-weight:760;line-height:.82;letter-spacing:-.08em;font-variant-numeric:tabular-nums}.unit{color:var(--muted);font:600 11px/1 ui-monospace,monospace;letter-spacing:.12em}.tempo-buttons{display:grid;gap:8px}.icon-button{width:42px;height:42px;border:1px solid #373b3c;border-radius:12px;color:var(--ink);background:var(--panel2);cursor:pointer}.icon-button:hover{border-color:#626767}.icon-button:disabled,.primary:disabled,.ai-action:disabled{cursor:not-allowed;opacity:.38}.play-panel{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;padding:22px 24px}.primary{width:80px;height:80px;border:0;border-radius:50%;color:#101112;background:var(--ink);font-weight:800;cursor:pointer;box-shadow:0 10px 32px rgba(0,0,0,.24)}.primary.running{color:white;background:var(--accent)}.beat-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.beat{height:54px;display:grid;place-items:end start;padding:9px;border:1px solid #303435;border-radius:12px;color:#555a5b;background:var(--panel2);font:600 10px/1 ui-monospace,monospace;transition:70ms ease}.beat.active{color:var(--cool);border-color:rgba(113,224,212,.55);background:rgba(113,224,212,.09);transform:translateY(-3px)}.beat.accent{color:var(--accent);border-color:rgba(255,112,67,.6);background:rgba(255,112,67,.1)}.pads{padding:22px;margin-bottom:16px}.section-heading{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:16px}.section-heading h2{margin:0 0 4px;font-size:15px}.section-heading p{margin:0;color:var(--muted);font-size:11px}.pad-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.pad-card{--pad:var(--cool);min-width:0;min-height:92px;position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:13px;overflow:hidden;border:1px solid #303435;border-radius:14px;color:var(--ink);background:var(--panel2);text-align:left;cursor:pointer;transition:transform 80ms,border-color 80ms,background 80ms}.pad-card:after{content:"";position:absolute;right:-18px;bottom:-26px;width:74px;height:74px;border-radius:50%;background:var(--pad);opacity:.08}.pad-card:hover{border-color:var(--pad)}.pad-card.hit{transform:translateY(-5px) scale(1.015);border-color:var(--pad);background:color-mix(in srgb,var(--pad) 12%,var(--panel2))}.pad-card:disabled{cursor:not-allowed;opacity:.42}.pad-key{color:var(--pad);font:700 10px/1 ui-monospace,monospace;letter-spacing:.12em}.pad-name{position:relative;z-index:1;overflow:hidden;max-width:100%;font-size:13px;font-weight:700;white-space:nowrap;text-overflow:ellipsis}.ai-panel{padding:22px;margin-bottom:16px}.ai-compose{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:stretch}.ai-compose textarea{min-height:82px;resize:vertical;padding:13px 14px;border:1px solid #343839;border-radius:12px;color:var(--ink);background:#0e1011;line-height:1.5}.ai-action{min-width:118px;padding:0 18px;border:0;border-radius:12px;color:#101112;background:var(--cool);font-weight:800;cursor:pointer}.ai-action.secondary{min-height:40px;color:var(--ink);background:transparent;border:1px solid #414647}.ai-status{min-height:18px;margin:10px 0 0;color:var(--muted);font-size:11px}.ai-status.error{color:var(--accent)}.ai-status.success{color:var(--cool)}.ai-result{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}.ai-result[hidden]{display:none}.ai-result-head{display:flex;align-items:start;justify-content:space-between;gap:18px;margin-bottom:12px}.ai-result-title{margin:0;font-size:16px}.ai-result-meta,.ai-note{margin:4px 0 0;color:var(--muted);font-size:11px}.ai-note{max-width:720px;line-height:1.55}.ai-preview-scroll{overflow-x:auto;padding:4px 0 10px}.ai-preview-grid{display:grid;grid-template-columns:120px repeat(16,22px);gap:5px;width:max-content;align-items:center}.ai-preview-step{width:22px;height:22px;border:1px solid #303435;border-radius:6px;background:#0e1011}.ai-preview-step.on{border-color:var(--pad);background:var(--pad);box-shadow:inset 0 0 0 3px rgba(0,0,0,.18)}.sequencer{padding:22px}.utility{display:flex;gap:8px}.text-button{min-height:34px;padding:0 12px;border:1px solid #343839;border-radius:9px;color:var(--muted);background:transparent;font-size:11px;cursor:pointer}.text-button:hover{color:var(--ink);border-color:#626767}.text-button:disabled,.step:disabled{cursor:not-allowed;opacity:.32}.sequence-scroll{overflow-x:auto;padding-bottom:8px;scrollbar-color:#414647 transparent}.sequence-grid{display:grid;grid-template-columns:120px repeat(16,var(--step));gap:7px;width:max-content;min-width:100%;align-items:center}.corner-label,.step-number{color:#616667;font:600 9px/1 ui-monospace,monospace;text-align:center}.corner-label{text-align:left}.step-number.bar{color:#a7aaa5}.track-label{display:flex;align-items:center;gap:9px;min-width:0;font-size:11px;font-weight:650}.track-dot{flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:var(--pad);box-shadow:0 0 12px color-mix(in srgb,var(--pad) 55%,transparent)}.step{width:var(--step);height:var(--step);padding:0;border:1px solid #303435;border-radius:9px;color:transparent;background:#0e1011;cursor:pointer;transition:transform 60ms,border-color 60ms,background 60ms}.step:hover{transform:scale(1.08);border-color:var(--pad)}.step:disabled:hover{transform:none;border-color:#303435}.step.on{border-color:var(--pad);background:var(--pad);box-shadow:inset 0 0 0 4px rgba(0,0,0,.16),0 0 14px color-mix(in srgb,var(--pad) 25%,transparent)}.step.playhead{outline:2px solid var(--ink);outline-offset:2px}.sequence-footer{display:flex;justify-content:space-between;gap:20px;margin-top:14px;color:var(--muted);font-size:10px}.sequence-footer strong{color:var(--ink);font-weight:650}.sequence-status.error{color:var(--accent)}@media(max-width:780px){.transport{grid-template-columns:1fr}.pad-grid{grid-template-columns:repeat(3,1fr)}.ai-compose{grid-template-columns:1fr}.ai-action{min-height:46px}}@media(max-width:520px){main{width:calc(100% - 20px);padding-top:18px}header{align-items:flex-start}.connection{padding:0 11px}.connection span:last-child{max-width:92px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.tempo-panel,.play-panel,.pads,.ai-panel,.sequencer{padding:17px}.pad-grid{grid-template-columns:repeat(2,1fr)}.section-heading{align-items:flex-start}.sequence-grid{grid-template-columns:96px repeat(16,var(--step))}.sequence-footer{flex-direction:column;gap:5px}.ai-result-head{flex-direction:column}}@media(prefers-reduced-motion:reduce){.beat,.pad-card,.step{transition:none}}
  </style>
</head>
<body>
  <main>
    <header><div class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><div><p class="eyebrow">EasyInput · 96 PPQN</p><h1>Drum Machine</h1></div></div><button class="connection" id="connectDevice" type="button" aria-live="polite"><span class="dot" aria-hidden="true"></span><span id="connectionText">连接设备</span></button></header>
    <section class="transport" aria-label="速度与播放控制">
      <div class="panel tempo-panel"><div><p class="tempo-label">TEMPO</p><div class="tempo-readout"><span id="bpmValue">120</span><span class="unit">BPM</span></div></div><div class="tempo-buttons"><button class="icon-button" id="faster" type="button" aria-label="速度加一" disabled>＋</button><button class="icon-button" id="slower" type="button" aria-label="速度减一" disabled>−</button></div></div>
      <div class="panel play-panel"><button class="primary" id="toggle" type="button" disabled>开始</button><div class="beat-strip" aria-label="四拍显示"><div class="beat"><span>01</span></div><div class="beat"><span>02</span></div><div class="beat"><span>03</span></div><div class="beat"><span>04</span></div></div></div>
    </section>
    <section class="panel pads" aria-labelledby="padsTitle"><div class="section-heading"><div><h2 id="padsTitle">实体按钮映射</h2><p>S3 暂停使用 · Closed Hi-Hat 已迁移至 S7</p></div></div><div class="pad-grid" id="padGrid"></div></section>
    <section class="panel ai-panel" aria-labelledby="aiTitle">
      <div class="section-heading"><div><h2 id="aiTitle">AI 编写鼓点</h2><p>DeepSeek V4 Flash · 先生成候选，点击“应用”后填入下方音序器</p></div></div>
      <div class="ai-compose"><textarea id="aiPrompt" maxlength="500" placeholder="例如：给我一个 92 BPM、松弛一点的 Boom Bap，底鼓不要太密，第二和第四拍有军鼓。"></textarea><button class="ai-action" id="generatePattern" type="button">生成鼓点</button></div>
      <p class="ai-status" id="aiStatus" aria-live="polite">输入描述后生成，网页会再次校验六轨 16 步结构。</p>
      <div class="ai-result" id="aiResult" hidden>
        <div class="ai-result-head"><div><h3 class="ai-result-title" id="aiPatternTitle"></h3><p class="ai-result-meta" id="aiPatternMeta"></p><p class="ai-note" id="aiPatternNote"></p></div><button class="ai-action secondary" id="applyAiPattern" type="button" disabled>应用</button></div>
      </div>
    </section>
    <section class="panel sequencer" aria-labelledby="sequenceTitle"><div class="section-heading"><div><h2 id="sequenceTitle">16 步音序器</h2><p id="sequenceSource">每格为 1/16 音符 · 四步一拍 · 自动跟随当前 BPM</p></div><div class="utility"><button class="text-button" id="clearPattern" type="button">清空</button></div></div><div class="sequence-scroll"><div class="sequence-grid" id="sequenceGrid"></div></div><div class="sequence-footer"><span class="sequence-status" id="patternStatus" aria-live="polite">连接设备后同步</span><span id="barDuration"><strong>2.00 秒</strong> / 小节</span></div></section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
